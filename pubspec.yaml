name: gg_multi_commit
description: "Daily ticket flows of the gg_multi tool family - committing, pushing, reviewing and upgrading dependencies across all repos of a ticket in dependency order."
version: 4.0.0
repository: https://github.com/ggsuite/gg_multi_commit.git

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  gg_args: ^3.0.1
  gg_changelog: ^2.0.1
  gg_console_colors: ^2.3.1
  gg_git: ^4.1.2
  gg_lang: ^0.5.1
  gg_local_package_dependencies: ^4.0.0
  gg_log: ^1.0.7
  gg_multi_core: ^4.0.0
  gg_one: ^14.2.1
  gg_publish: ^4.3.3
  gg_status_printer: ^1.4.3
  path: ^1.9.1
  pub_semver: ^2.2.0

dev_dependencies:
  args: ^2.7.0
  gg_capture_print: ^1.0.10
  lints: ^6.1.0
  mocktail: ^1.0.5
  pubspec_parse: ^1.5.0
  test: ^1.31.2