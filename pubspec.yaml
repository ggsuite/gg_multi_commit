name: gg_multi_commit
description: "Daily ticket flows of the gg_multi tool family - committing, pushing, reviewing and upgrading dependencies across all repos of a ticket in dependency order."
version: 1.0.0
repository: https://github.com/ggsuite/gg_multi_commit.git

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  gg_args: ^2.2.0
  gg_changelog: ^1.1.5
  gg_console_colors: ^2.3.0
  gg_git: ^3.2.2
  gg_lang: ^0.4.0
  gg_local_package_dependencies: ^2.1.0
  gg_log: ^1.0.6
  gg_multi_core: ^1.0.0
  gg_one: ^12.9.0
  gg_publish: ^3.10.2
  gg_status_printer: ^1.4.2
  path: ^1.9.1

dev_dependencies:
  args: ^2.7.0
  gg_capture_print: ^1.0.9
  lints: ^6.1.0
  mocktail: ^1.0.5
  pubspec_parse: ^1.5.0
  test: ^1.31.2
