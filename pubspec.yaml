name: gg_multi_commit
description: "Daily ticket flows of the gg_multi tool family - committing, pushing, reviewing and upgrading dependencies across all repos of a ticket in dependency order."
version: 4.2.3
repository: https://github.com/ggsuite/gg_multi_commit.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  gg_args: ^3.2.0
  gg_changelog: ^2.2.1
  gg_console_colors: ^2.5.0
  gg_git: ^4.4.2
  gg_lang: ^0.8.1
  gg_local_package_dependencies: ^4.2.1
  gg_log: ^1.2.0
  gg_multi_core: ^4.7.0
  gg_one: ^14.4.3
  gg_publish: ^4.7.1
  gg_status_printer: ^1.6.1
  path: ^1.9.1
  pub_semver: ^2.2.1

dev_dependencies:
  args: ^2.7.0
  dna_ggsuite: ^0.2.2
  gg_capture_print: ^1.2.0
  helix: ^1.9.0
  lints: ^6.1.0
  mocktail: ^1.0.5
  pubspec_parse: ^1.6.0
  test: ^1.32.0