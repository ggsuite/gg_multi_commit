name: gg_multi_commit
description: "Daily ticket flows of the gg_multi tool family - committing, pushing, reviewing and upgrading dependencies across all repos of a ticket in dependency order."
version: 4.8.0
repository: https://github.com/ggsuite/gg_multi_commit.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  gg_args: ^3.2.0
  gg_changelog: ^2.2.4
  gg_console_colors: ^2.5.0
  gg_git: ^4.5.5
  gg_lang: ^0.8.3
  gg_local_package_dependencies: ^4.2.3
  gg_log: ^1.2.0
  gg_multi_core: ^4.12.0
  gg_one: ^14.4.12
  gg_one_core: ^2.15.1
  gg_publish: ^4.10.2
  gg_status_printer: ^1.6.3
  path: ^1.9.1
  pub_semver: ^2.2.1

dev_dependencies:
  args: ^2.7.0
  dna_ggsuite: ^1.0.0
  gg_capture_print: ^1.2.1
  helix: ^1.14.0
  lints: ^6.1.0
  mocktail: ^1.0.5
  pubspec_parse: ^1.7.0
  test: ^1.33.0